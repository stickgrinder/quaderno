# SPDX-License-Identifier: GPL-3.0-or-later
name: vault

on:
  push:
    paths:
      - "crates/**"
      - "vault-spec/**"
      - "fixtures/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/vault.yml"
  pull_request:
    paths:
      - "crates/**"
      - "vault-spec/**"
      - "fixtures/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/vault.yml"

permissions:
  contents: read

jobs:
  check:
    name: quaderno-vault
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install SQLCipher build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config sqlcipher
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p quaderno-vault --all-targets -- -D warnings
      - name: Test
        run: cargo test -p quaderno-vault
      - name: Check the committed sample with the Python reader
        run: python3 tools/read_sample.py fixtures/sample.quaderno --check fixtures/sample.json
      - name: Generate a fresh sample and read it back
        run: |
          export QUADERNO_FIXTURES_DIR="$RUNNER_TEMP/fixtures"
          cargo run -p quaderno-vault --example generate_fixtures
          python3 tools/read_sample.py \
            "$RUNNER_TEMP/fixtures/sample.quaderno" \
            --check "$RUNNER_TEMP/fixtures/sample.json"
