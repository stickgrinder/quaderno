# SPDX-License-Identifier: GPL-3.0-or-later
name: vault

on:
  push:
    paths:
      - "crates/**"
      - "vault-spec/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/vault.yml"
  pull_request:
    paths:
      - "crates/**"
      - "vault-spec/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/vault.yml"

permissions:
  contents: read

jobs:
  check:
    name: quaderno-vault
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p quaderno-vault --all-targets -- -D warnings
      - name: Test
        run: cargo test -p quaderno-vault
