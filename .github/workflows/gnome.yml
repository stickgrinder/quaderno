# SPDX-License-Identifier: GPL-3.0-or-later
name: gnome

on:
  push:
    paths:
      - "src/**"
      - "ui/**"
      - "data/**"
      - "po/**"
      - "build-aux/**"
      - "crates/**"
      - "vault-spec/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "meson.build"
      - ".github/workflows/gnome.yml"
  pull_request:
    paths:
      - "src/**"
      - "ui/**"
      - "data/**"
      - "po/**"
      - "build-aux/**"
      - "crates/**"
      - "vault-spec/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "meson.build"
      - ".github/workflows/gnome.yml"

permissions:
  contents: read

jobs:
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: quaderno.flatpak
          manifest-path: build-aux/io.github.stickgrinder.Quaderno.json
          run-tests: true
