# SPDX-License-Identifier: GPL-3.0-or-later

[package]
name = "quaderno-vault"
description = "Shared library for reading and writing Quaderno vaults"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "quaderno_vault"
path = "src/lib.rs"

[features]
default = ["bundled-sqlcipher"]
# Build SQLCipher from source and link the host OpenSSL (used by Flatpak and
# development builds).
bundled-sqlcipher = ["rusqlite/bundled-sqlcipher"]
# Link the distribution's SQLCipher instead (used by distribution packages).
# `modern_sqlite` pulls in libsqlite3-sys's prebuilt SQLCipher bindings, which
# declare `sqlite3_key`/`sqlite3_rekey`; without them the system build cannot
# key the database.
system-sqlcipher = ["rusqlite/sqlcipher", "rusqlite/modern_sqlite"]

[dependencies]
rusqlite = { workspace = true, features = ["backup"] }
uuid = { workspace = true }
unicode-normalization = { workspace = true }
jiff = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
jiff = { workspace = true }
tempfile = "3"
uuid = { workspace = true }
