# SPDX-License-Identifier: GPL-3.0-or-later

[package]
name = "quaderno-vault"
description = "Shared library for reading and writing Quaderno vaults"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "quaderno_vault"
path = "src/lib.rs"

[features]
default = ["bundled-sqlcipher"]
# Build SQLCipher from source and link the host OpenSSL (used by Flatpak and
# development builds).
bundled-sqlcipher = ["rusqlite/bundled-sqlcipher"]
# Link the distribution's SQLCipher instead (used by distribution packages).
system-sqlcipher = ["rusqlite/sqlcipher"]

[dependencies]
rusqlite = { workspace = true, features = ["backup"] }
uuid = { workspace = true }
unicode-normalization = { workspace = true }
jiff = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
jiff = { workspace = true }
serde_json = "1"
tempfile = "3"
uuid = { workspace = true }
