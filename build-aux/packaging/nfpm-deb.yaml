# SPDX-License-Identifier: GPL-3.0-or-later
#
# Debian/Ubuntu package. The workflow stages the install tree under
# `staging/usr` and runs:
#   nfpm package --config build-aux/packaging/nfpm-deb.yaml --packager deb \
#     --target dist/quaderno_<version>-1_amd64.deb
name: quaderno
arch: amd64
platform: linux
version: 0.1.0
release: "1"
section: utils
priority: optional
maintainer: Paolo Pustorino <stickgrinder@gmail.com>
description: |
  Private, encrypted personal journal for GNOME. Journal pages, dreams and
  quick notes are stored in one encrypted file on your device, with optional
  ratings, emotions, activities, colours, people, places, things and tags.
vendor: Paolo Pustorino
homepage: https://github.com/stickgrinder/quaderno
license: GPL-3.0-or-later
depends:
  - libgtk-4-1 (>= 4.18)
  - libadwaita-1-0 (>= 1.7)
  - libspelling-1-2
  - libsqlcipher0
  - libglib2.0-0t64
  - hicolor-icon-theme
  - dconf-gsettings-backend
contents:
  - src: staging/usr/bin/quaderno
    dst: /usr/bin/quaderno
  - src: staging/usr/share
    dst: /usr/share
