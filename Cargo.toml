[workspace]
resolver = "3"
members = ["crates/quaderno-vault", "gnome"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["Paolo Pustorino <stickgrinder@gmail.com>"]
repository = "https://github.com/stickgrinder/quaderno"

[workspace.dependencies]
# The gtk-rs crates gate API level behind Cargo features. Enabling exactly
# `v4_18` / `v1_7` enforces the minimums in AGENTS.md and prevents accidentally
# using newer APIs.
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }

# quaderno-vault. `rusqlite` is used with SQLCipher; the SQLCipher feature is
# selected by the crate's own `bundled-sqlcipher` / `system-sqlcipher` features.
rusqlite = { version = "0.40", features = ["backup"] }
uuid = { version = "1", features = ["v7"] }
unicode-normalization = "0.1"
jiff = "0.2"
thiserror = "2"
zeroize = "1"
serde_json = "1"
